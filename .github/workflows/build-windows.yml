name: Build Honor Control

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/HonorControl/**'
      - 'HonorControl.sln'
      - 'global.json'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    name: Publish WinUI 3 x64
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.408'

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Restore dependencies once
        run: >-
          msbuild src/HonorControl/HonorControl.csproj
          /target:Restore
          /property:Configuration=Release
          /property:Platform=x64
          /property:RuntimeIdentifier=win-x64
          /property:SelfContained=true
          /property:WindowsAppSDKSelfContained=true

      # Publish the framework-dependent layout first so it cannot reuse files
      # generated by the self-contained publish that follows it.
      - name: Publish lightweight application
        run: >-
          msbuild src/HonorControl/HonorControl.csproj
          /target:Publish
          /property:Configuration=Release
          /property:Platform=x64
          /property:RuntimeIdentifier=win-x64
          /property:SelfContained=false
          /property:WindowsAppSDKSelfContained=false
          /property:PublishDir=${{ github.workspace }}\artifacts\HonorControl-lightweight\

      - name: Publish portable application
        run: >-
          msbuild src/HonorControl/HonorControl.csproj
          /target:Publish
          /property:Configuration=Release
          /property:Platform=x64
          /property:RuntimeIdentifier=win-x64
          /property:SelfContained=true
          /property:WindowsAppSDKSelfContained=true
          /property:PublishDir=${{ github.workspace }}\artifacts\HonorControl\

      - name: Verify both application variants
        shell: pwsh
        run: |
          $variants = @(
            @{ Name = 'Portable'; Root = '${{ github.workspace }}\artifacts\HonorControl'; SelfContained = $true },
            @{ Name = 'Lightweight'; Root = '${{ github.workspace }}\artifacts\HonorControl-lightweight'; SelfContained = $false }
          )
          foreach ($variant in $variants) {
            $requiredNames = @(
              'HonorControl.exe',
              'HonorControl.pri',
              'Microsoft.Management.Infrastructure.dll',
              'Microsoft.Management.Infrastructure.Native.dll',
              'microsoft.management.infrastructure.native.unmanaged.dll'
            )
            if ($variant.SelfContained) {
              $requiredNames += @('Microsoft.UI.Xaml.dll', 'System.Private.CoreLib.dll', 'coreclr.dll')
            } else {
              $requiredNames += @('Microsoft.WindowsAppRuntime.Bootstrap.dll', 'Microsoft.WindowsAppRuntime.Bootstrap.Net.dll')
            }
            $requiredFiles = $requiredNames | ForEach-Object { Join-Path $variant.Root $_ }
            $missingFiles = $requiredFiles | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
            if ($missingFiles.Count -gt 0) {
              throw "$($variant.Name) application is incomplete. Missing: $($missingFiles -join ', ')"
            }
          }
          $lightweightRoot = '${{ github.workspace }}\artifacts\HonorControl-lightweight'
          $unexpectedNames = @('System.Private.CoreLib.dll', 'coreclr.dll', 'Microsoft.UI.Xaml.dll')
          $unexpectedFiles = $unexpectedNames | ForEach-Object { Join-Path $lightweightRoot $_ } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
          if ($unexpectedFiles.Count -gt 0) {
            throw "Lightweight application unexpectedly contains self-contained runtime files: $($unexpectedFiles -join ', ')"
          }
          $portableConfig = Get-Content -Raw -LiteralPath '${{ github.workspace }}\artifacts\HonorControl\HonorControl.runtimeconfig.json' | ConvertFrom-Json
          $lightweightConfig = Get-Content -Raw -LiteralPath '${{ github.workspace }}\artifacts\HonorControl-lightweight\HonorControl.runtimeconfig.json' | ConvertFrom-Json
          if (-not $portableConfig.runtimeOptions.includedFrameworks -or $portableConfig.runtimeOptions.framework) {
            throw 'Portable runtimeconfig is not self-contained.'
          }
          if ($lightweightConfig.runtimeOptions.framework.name -ne 'Microsoft.NETCore.App' -or $lightweightConfig.runtimeOptions.includedFrameworks) {
            throw 'Lightweight runtimeconfig is not framework-dependent.'
          }

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: HonorControl-win-x64
          path: artifacts/HonorControl
          if-no-files-found: error
          retention-days: 14

      - name: Upload lightweight artifact
        uses: actions/upload-artifact@v4
        with:
          name: HonorControl-win-x64-lightweight
          path: artifacts/HonorControl-lightweight
          if-no-files-found: error
          retention-days: 14
