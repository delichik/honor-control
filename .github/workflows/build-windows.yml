name: Build Honor Control

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/HonorControl/**'
      - 'HonorControl.sln'
      - 'global.json'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    name: Publish WinUI 3 x64
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.408'

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Publish self-contained application with Visual Studio MSBuild
        run: >-
          msbuild src/HonorControl/HonorControl.csproj
          /restore
          /target:Publish
          /property:Configuration=Release
          /property:Platform=x64
          /property:RuntimeIdentifier=win-x64
          /property:SelfContained=true
          /property:WindowsAppSDKSelfContained=true
          /property:PublishDir=${{ github.workspace }}\artifacts\HonorControl\

      - name: Upload application artifact
        uses: actions/upload-artifact@v4
        with:
          name: HonorControl-win-x64
          path: artifacts/HonorControl
          if-no-files-found: error
          retention-days: 14
