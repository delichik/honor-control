name: Build Honor Control

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/HonorControl/**'
      - 'src/HonorControl.Contracts/**'
      - 'src/HonorControl.Service/**'
      - 'panel/**'
      - 'installer/**'
      - 'HonorControl.sln'
      - 'global.json'
      - 'tools/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    name: Publish WinUI 3 x64
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.408'

      - name: Test Windows power scheme reads (read-only)
        shell: pwsh
        run: ./tools/Test-PowerSchemeRead.ps1

      # 控制面板与托盘已经取代原来的 WinUI 界面（src/HonorControl 仍在仓库里作为参考实现，
      # 但不再进入安装包：它与服务端 v2 协议已经不兼容）。
      # 这一步曾经是 continue-on-error（Rust 外壳首次编译前）；现在它编译稳定，改为硬门禁。
      - name: Publish control panel (React + Tauri)
        id: panel_build
        shell: pwsh
        run: |
          Push-Location panel
          npm ci --no-audit --no-fund
          npm run tauri build
          $exit = $LASTEXITCODE
          Pop-Location
          if ($exit -ne 0) { throw "Tauri build failed with exit code $exit." }
          # Tauri 的可执行文件与图标一起搬进安装器需要的目录结构
          $panel = '${{ github.workspace }}\artifacts\HonorControl-panel'
          New-Item -ItemType Directory -Force -Path $panel | Out-Null
          Copy-Item 'panel\src-tauri\target\release\honor-control-panel.exe' $panel -Force
          Copy-Item 'panel\src-tauri\icons\icon.ico' (Join-Path $panel 'HonorControl.ico') -Force

      - name: Publish tray process
        shell: pwsh
        run: >-
          dotnet publish src/HonorControl.Tray/HonorControl.Tray.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output '${{ github.workspace }}\artifacts\HonorControl-tray'

      - name: Publish background service
        shell: pwsh
        run: >-
          dotnet publish src/HonorControl.Service/HonorControl.Service.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output '${{ github.workspace }}\artifacts\HonorControl-service'

      - name: Stage tray icon
        shell: pwsh
        run: |
          # 托盘从自己的目录旁边找图标（找不到会退化成系统默认图标）。
          Copy-Item 'src\HonorControl\Assets\HonorControl.ico' 'artifacts\HonorControl-tray\HonorControl.ico' -Force

      # 诊断工具直接编译服务端源码（BatteryService / HistoryStore），
      # 因此服务端改了内部接口而没同步工具时会在这里失败——这是刻意的。
      - name: Build diagnostic probes
        shell: pwsh
        run: |
          dotnet build tools/BatteryProbe/BatteryProbe.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build tools/HistoryProbe/HistoryProbe.csproj --configuration Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      # 安装器必须包含控制面板。面板构建已经变成硬门禁（见上一步），这里只是把前置条件写清楚：
      # 缺少面板产物时直接失败，而不是产出一个装了也没法用的安装包。
      - name: Check control panel payload
        shell: pwsh
        run: |
          $panel = '${{ github.workspace }}\artifacts\HonorControl-panel\honor-control-panel.exe'
          if (-not (Test-Path -LiteralPath $panel -PathType Leaf)) {
            throw "Control panel payload is missing ($panel); the installer cannot be produced."
          }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Build online installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Inno Setup compiler not found.' }
          & $compiler installer/HonorControl.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = 'artifacts/installer/HonorControl-Setup-x64.exe'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw 'Installer output not found.' }

      # 校验安装器三个载荷：服务（.NET 框架依赖）、托盘（.NET 框架依赖）、面板（Tauri 自带运行时）。
      - name: Verify installer payloads
        shell: pwsh
        run: |
          $serviceRoot = '${{ github.workspace }}\artifacts\HonorControl-service'
          $trayRoot = '${{ github.workspace }}\artifacts\HonorControl-tray'
          $panelRoot = '${{ github.workspace }}\artifacts\HonorControl-panel'
          $requiredFiles = @(
            "$serviceRoot\HonorControl.Service.exe",
            "$serviceRoot\HonorControl.Contracts.dll",
            "$serviceRoot\Microsoft.Management.Infrastructure.dll",
            "$trayRoot\HonorControl.Tray.exe",
            "$trayRoot\HonorControl.ico",
            "$panelRoot\honor-control-panel.exe"
          )
          $missingFiles = $requiredFiles | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($missingFiles.Count -gt 0) { throw "Installer payload incomplete: $($missingFiles -join ', ')" }

          # 服务与托盘都必须是框架依赖发布：把运行时打进安装包会让包体积暴涨，
          # 而且安装器的依赖预检（Microsoft.NETCore.App 8.0）就是为它们准备的。
          foreach ($root in @($serviceRoot, $trayRoot)) {
            $runtimeConfig = Get-ChildItem -LiteralPath $root -Filter '*.runtimeconfig.json' | Select-Object -First 1
            if (-not $runtimeConfig) { throw "No runtimeconfig.json found under $root." }
            $config = Get-Content -Raw -LiteralPath $runtimeConfig.FullName | ConvertFrom-Json
            if ($config.runtimeOptions.framework.name -ne 'Microsoft.NETCore.App' -or $config.runtimeOptions.includedFrameworks) {
              throw "$($runtimeConfig.Name) is not framework-dependent."
            }
            foreach ($unexpected in @('System.Private.CoreLib.dll', 'coreclr.dll')) {
              if (Test-Path -LiteralPath (Join-Path $root $unexpected) -PathType Leaf) {
                throw "$root unexpectedly contains self-contained runtime files ($unexpected)."
              }
            }
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HonorControl-Setup-x64
          path: artifacts/installer/HonorControl-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14

  panel:
    name: Build control panel (React)
    runs-on: windows-2022
    timeout-minutes: 15

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: panel/package-lock.json

      - name: Install panel dependencies
        working-directory: panel
        run: npm ci --no-audit --no-fund

      # 守卫：Fluent token/图标名必须真实存在；示例数据只允许从 queries.js 注入、
      # 原生调用只允许走 transport.js。这两条是代码约定，靠人记不住，交给 CI。
      - name: Verify panel invariants
        working-directory: panel
        run: npm run verify

      - name: Build panel frontend
        working-directory: panel
        run: npm run build

      - name: Upload panel frontend
        uses: actions/upload-artifact@v4
        with:
          name: HonorControl-panel-frontend
          path: panel/dist
          if-no-files-found: error
          retention-days: 14
