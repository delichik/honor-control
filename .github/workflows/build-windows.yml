name: Build Honor Control

on:
  workflow_dispatch:
  push:
    paths:
      - 'src/HonorControl/**'
      - 'src/HonorControl.Contracts/**'
      - 'src/HonorControl.Service/**'
      - 'installer/**'
      - 'HonorControl.sln'
      - 'global.json'
      - 'tools/**'
      - '.github/workflows/build-windows.yml'

permissions:
  contents: read

jobs:
  build:
    name: Publish WinUI 3 x64
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.408'

      - name: Test Windows power scheme reads (read-only)
        shell: pwsh
        run: ./tools/Test-PowerSchemeRead.ps1

      - name: Set up Visual Studio MSBuild
        uses: microsoft/setup-msbuild@v2
        with:
          vs-version: '[17.0,18.0)'

      - name: Restore application dependencies
        run: >-
          msbuild src/HonorControl/HonorControl.csproj
          /target:Restore
          /property:Configuration=Release
          /property:Platform=x64
          /property:RuntimeIdentifier=win-x64
          /property:SelfContained=false
          /property:WindowsAppSDKSelfContained=false

      - name: Publish lightweight application
        shell: pwsh
        run: >-
          .\tools\Publish-HonorControl.ps1
          -SelfContained $false
          -WindowsAppSdkSelfContained $false
          -PublishDirectory '${{ github.workspace }}\artifacts\HonorControl-lightweight\'

      - name: Publish background service
        shell: pwsh
        run: >-
          dotnet publish src/HonorControl.Service/HonorControl.Service.csproj
          --configuration Release
          --runtime win-x64
          --self-contained false
          --output '${{ github.workspace }}\artifacts\HonorControl-service'

      - name: Parse installer scripts
        shell: pwsh
        run: |
          foreach ($script in @('installer/Install-Prerequisites.ps1', 'installer/Manage-Service.ps1')) {
            $tokens = $null
            $errors = $null
            [System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $script), [ref]$tokens, [ref]$errors) | Out-Null
            if ($errors.Count -gt 0) { throw "$script has PowerShell syntax errors: $($errors -join '; ')" }
          }

      - name: Install Inno Setup compiler
        shell: pwsh
        run: choco install innosetup --version=6.7.1 -y --no-progress

      - name: Build online installer
        shell: pwsh
        run: |
          $compiler = 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe'
          if (-not (Test-Path -LiteralPath $compiler -PathType Leaf)) { throw 'Inno Setup compiler not found.' }
          & $compiler installer/HonorControl.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $setup = 'artifacts/installer/HonorControl-Setup-x64.exe'
          if (-not (Test-Path -LiteralPath $setup -PathType Leaf)) { throw 'Installer output not found.' }

      - name: Verify installer payloads
        shell: pwsh
        run: |
          $lightweightRoot = '${{ github.workspace }}\artifacts\HonorControl-lightweight'
          $serviceRoot = '${{ github.workspace }}\artifacts\HonorControl-service'
          $requiredFiles = @(
            "$lightweightRoot\HonorControl.exe",
            "$lightweightRoot\HonorControl.pri",
            "$lightweightRoot\HonorControl.Contracts.dll",
            "$lightweightRoot\Assets\HonorControl.ico",
            "$lightweightRoot\Microsoft.WindowsAppRuntime.Bootstrap.dll",
            "$lightweightRoot\Microsoft.WindowsAppRuntime.Bootstrap.Net.dll",
            "$serviceRoot\HonorControl.Service.exe",
            "$serviceRoot\HonorControl.Contracts.dll",
            "$serviceRoot\Microsoft.Management.Infrastructure.dll"
          )
          $missingFiles = $requiredFiles | Where-Object { -not (Test-Path -LiteralPath $_ -PathType Leaf) }
          if ($missingFiles.Count -gt 0) { throw "Installer payload incomplete: $($missingFiles -join ', ')" }
          $unexpectedNames = @('System.Private.CoreLib.dll', 'coreclr.dll', 'Microsoft.UI.Xaml.dll')
          $unexpectedFiles = $unexpectedNames | ForEach-Object { Join-Path $lightweightRoot $_ } | Where-Object { Test-Path -LiteralPath $_ -PathType Leaf }
          if ($unexpectedFiles.Count -gt 0) {
            throw "Lightweight application unexpectedly contains self-contained runtime files: $($unexpectedFiles -join ', ')"
          }
          $lightweightConfig = Get-Content -Raw -LiteralPath '${{ github.workspace }}\artifacts\HonorControl-lightweight\HonorControl.runtimeconfig.json' | ConvertFrom-Json
          if ($lightweightConfig.runtimeOptions.framework.name -ne 'Microsoft.NETCore.App' -or $lightweightConfig.runtimeOptions.includedFrameworks) {
            throw 'Lightweight runtimeconfig is not framework-dependent.'
          }

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: HonorControl-Setup-x64
          path: artifacts/installer/HonorControl-Setup-x64.exe
          if-no-files-found: error
          retention-days: 14
